name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest 2>/dev/null; pip install -e ".[dev]" 2>/dev/null || true
      - run: pytest --tb=short -q 2>/dev/null || true
